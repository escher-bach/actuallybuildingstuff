[run]
name = "t4x2-rlvr-bigstep-seed0"
root_seed = 20260811
mode = "rlvr"
# Pairs with t4x2_rlvr_klanchor_seed0.toml and differs from it in exactly one
# field: the learning rate. That arm moved the policy only 0.005 nats of KL and
# 7% of teacher-forced NLL over its whole budget, which is enough to fix cheap
# protocol errors and not enough to change a decision policy. This arm tests
# whether a step size chosen for this model rather than borrowed from RLHF
# practice for far larger ones reaches the process at all.
arm = "outcome_only_from_dense"

[source]
run_name = "t4x2-dense-seed0"
git_sha = "84f29385ed623500aa2e201c45fdcf8c2257fac0"
config_hash = "b91eedc2655253edd662c320753c2680cb7842484411c22130deeda31a58cb14"
model_state_sha256 = "cef0ac5a4159d65eae336be58c34dfe1e3f078a8024f4b98a7ca1a78e42a9a6e"

[world]
n_hyp = 6
n_probe = 5
n_evidence = 2
cost_lo = 1
cost_hi = 3
budget_slack = 1
min_depth = 2
step_slack = 2
variant = "irreversible"
rendering = "a"
context_length = 2048
train_episodes = 32768
validation_episodes = 1024
structural_episodes = 1024
transfer_episodes = 1024

[rollout]
train_seed_offset = 4000000
max_turns = 12
max_action_tokens = 96
max_prompt_tokens = 256
max_completion_tokens = 1536
generation_rows = 32
temperature = 1.0
top_p = 1.0
top_k = 0

[grpo]
num_generations = 8
per_device_sequences = 4
steps_per_generation = 8
# Everything below is identical to t4x2_rlvr_warmstart_seed0.toml except beta,
# so the pair isolates the effect of the anchor: same budget, same world stream,
# same seeds, same evaluator.
max_steps = 191
# 1e-4: about 33x the borrowed 3e-6, and still 6x below the 6e-4 the dense arm
# used to train this same 19.2M model. Declared, not tuned. The KL anchor below
# is retained deliberately — it never engaged at the small step size, so if it
# engages here that is itself the finding, and it guards against a collapse
# being mistaken for an answer.
learning_rate = 0.0001
warmup_fraction = 0.02
weight_decay = 0.0
lr_scheduler_type = "constant_with_warmup"
beta = 0.02
epsilon = 0.2
loss_type = "dapo"
scale_rewards = "group"
num_iterations = 1
mask_truncated_completions = false
spend_reward_weight = 0.0
milestones_updates = [48, 95, 191]

[evaluation]
milestone_episodes = 512
