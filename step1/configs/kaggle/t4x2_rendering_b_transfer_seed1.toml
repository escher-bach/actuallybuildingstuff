[calibration]
# Foundation-protocol cumulative curve points, rounded to exact 32,768-token
# Trainer updates. The 3,052-update point is the declared all-B reference.
#
# This grid is a strict superset of the seed-0 grid [0, 31, 92, 306, 916,
# 3052]; every seed-0 point is retained at its exact update count, so the two
# seeds remain directly comparable. The six added points densify two intervals
# the seed-0 run left unobserved:
#   306 -> 916   (10M -> 30M tokens), where seed-0 A-trained success fell from
#                21.3% to 1.3% with invalid actions rising to 97.0%; and
#   916 -> 3052  (30M -> 100M tokens), where it recovered to 44.6%.
# Localizing that non-monotonicity is the reason this seed is being run.
budgets_updates = [0, 31, 92, 306, 458, 611, 764, 916, 1221, 1526, 2289, 3052]
global_input_tokens_per_update = 32768
per_device_sequences = 4
learning_rate = 0.0006
warmup_fraction = 0.02
weight_decay = 0.1
calibration_seed_offset = 3000000
calibration_episodes = 32768
include_full_b_reference = true

[evaluation]
# Same latent held-out worlds as the seed-1 A validation set, rendered in B.
seed_offset = 1000000
episodes = 1024
generation_batch_size = 32
include_reversible_control = true
