schema_version = 1

[run]
name = "step2-dagger"
purpose = "paired DAgger arm against the audited f9b1647 behaviour-cloning control: same world, budget, seed, lr and batch, changing only where training states come from"
seed = 20260824
require_two_t4 = true
mixed_precision = "fp16"
# 9.913 optimizer steps/s measured on two T4s in run 3e973b6, so this is about
# 59 minutes of lineage training. The 256-update run at this same learning
# rate and seed is the paired point of comparison; budget is the only
# training factor changed.
max_updates = 35000
per_device_batch_size = 8
gradient_accumulation_steps = 1
learning_rate = 0.0003
weight_decay = 0.1
warmup_updates = 700
max_grad_norm = 1.0
log_every = 250
# 512 held-out episodes per evaluation instead of 64. At 64 the success-rate
# cells were 3 to 12 episodes and too noisy to read; both evaluations cost
# seconds, so the wider support is nearly free.
eval_batches = 32
resume_smoke_update = 4
overfit_updates = 128
overfit_warmup_updates = 12
overfit_per_device_batch_size = 2
overfit_required_fraction = 0.80
checkpoint_label = "dagger-arm"
# Hard stops, rescaled for an hour-scale run. Expected total is about 64
# minutes: roughly 4 of build, tests and preflight, and 60 of GPU work. The
# layers fire innermost first so the most specific one writes evidence:
# GPU phase 80 min, whole runner 90 min, notebook 100 min. The runner bound
# is the 1.5 hour ceiling agreed for unattended runs.
gpu_phase_timeout_seconds = 4800
max_wall_clock_seconds = 5400

[model]
config = "step2/artifacts/icrt-derived-small/model_config.json"
sequence_length = 192

[world]
d_min = 1
d_max = 4
gain_min = 0.75
gain_max = 1.25
action_limit = 0.20
calibration_pulse = 0.10
max_control_steps = 4
train_seed = 11001
validation_seed = 22001
overfit_seed = 33001
rollout_seed = 44001

[preflight]
validation_instances = 4096
cpu_benchmark_episodes = 4096
cpu_benchmark_batch_size = 64
cpu_benchmark_repeats = 5
rollout_episodes_per_rank = 256

[evaluation]
error_thresholds = [0.01, 0.025, 0.05, 0.10, 0.20, 0.40]
trivial_policy_scales = [0.0, 0.25, 0.50, 0.75, 1.0]
baseline_episodes = 4096

[dagger]
# Matched to f9b1647 so the arms are paired: same 35,000 updates, same world
# d=1..4, same seed, learning rate and batch size. Only the source of the
# training states changes.
updates = 35000
# beta = 1 (pure expert) for the first 5,000 updates. Rolling out an
# untrained policy yields states that are off-distribution in a way that
# teaches nothing, which is why DAgger's first iteration is the expert's.
warmup_updates = 5000
# Ten refreshes over the remaining 30,000 updates.
refresh_every = 3000
episodes_per_refresh = 128
# Sliding window rather than all-history aggregation: bounded memory, and the
# buffer stays close to the current policy.
buffer_episodes = 512
# Half of each batch drawn from learner-visited states once the buffer fills.
fraction = 0.5
