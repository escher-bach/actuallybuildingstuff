id = "wcst-reversal"
title = "Piecewise-stationary rule identification -- silent mid-episode rule change"
vein = "2.3"
their_term = "Wisconsin Card Sorting Test; reversal learning; set-shifting"
substrate = "card sorting over d anonymized dimensions with v values"
status = "lead"
levels = ["L1", "L2", "L3"]
complexity_modes = ["state_width", "input_entropy"]
contents = ["structure_induction", "state", "selection"]
asymmetries = ["evaluate/search"]
plant_role = "none"
plant_pair = ""
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "belief-state-reset",
    "posterior-enumeration",
    "informative-query-selection",
]
predicted_block = "the clinical literature groups these by executive-function constructs (perseveration, set-shifting) measured on populations. That is an ontology about people, not about tasks, and it makes no prediction we should import."
notes = """
**BLOCKED from implementation** by the paradigm coverage check (docs/06). The
formalism assumes theta is sampled once and holds; this family violates that,
and the row's current fix -- folding the switch schedule into theta -- restores
A1 but is a workaround: it makes theta an object with internal temporal
structure that the level wrappers have no way to read. Implementing it now would
bake the workaround in. Blocked on a validity-duration declaration, which is
itself deliberately deferred until after the Task Spec section 8 step 5 sweep.

**The row that broke the primitive vocabulary, which is why it is worth having.**

Every primitive in the register assumed MONOTONE belief refinement:
`belief-state-maintenance` says so in its gloss, `hypothesis-elimination` only
ever cuts, and nothing could restore a hypothesis once removed. This paradigm
requires the opposite -- the rule changes silently mid-episode, so a converged
belief must be discarded and possibilities previously eliminated brought back.
That is `belief-state-reset`, accepted as the eleventh primitive on the strength
of this row and the drifting-parameter case appearing independently.

**It is also the closest thing in the register to the programme's stated
priority.** Task Spec section 5 names recovery from error as what a text corpus
teaches worst. This is recovery at the level of belief rather than action, and it
arrived from the one vein built by people studying organisms that must do it to
survive. The register did not have it before, and would not have got it from the
computational veins -- both 2.2 and 2.5 assume a fixed theta throughout.

**A reveal policy our four levels do not cover.** Not L1: theta is not fixed for
the episode. Not L3: theta IS identifiable, just not stably. The dial in Task
Spec section 2 is 'how much does the context determine y', and this paradigm
varies something else -- how long the context stays valid. Recorded as a finding
rather than forced into a level, per Task Spec section 8 step 5's expectation
that the named cuts are in the wrong places.
"""

