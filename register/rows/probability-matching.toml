predicted_block = "the judgment-and-decision-making literature groups this with choice-behaviour phenomena and explains it in terms of strategy selection. That is an account of why humans deviate from optimality, not a claim about task structure, and predicts nothing for us."
notes = """
Implemented at src/repertoire/families/stochastic.py. Tests assert the
property that makes it worth having: the L3 target stays a genuine distribution
under mixed evidence rather than collapsing to the majority outcome, and never
fully resolves however long the history.

**A design flaw the tests caught.** The rate grid originally included the
endpoints 0 and 1. A rate of exactly 0 or 1 is deterministic -- it carries no
irreducible noise and IS fully resolvable from a finite history -- so after a
long run of one outcome the posterior collapsed to a point and the family
silently stopped being an L3 exemplar, on exactly the histories most likely to
arise. The grid is now strictly interior. Recorded because the family would have
looked fine: it ran, it was stochastic, and only the assertion that the posterior
never fully resolves distinguished it from a family that quietly becomes L1.

Three jobs at once, which is why it earns a row despite being the simplest
family in the register.

**1. The independent-pair plant**, against `shj-type-i`. Different Theta topology
(a continuous or finely-discretized rate vs a small finite rule set), different
oracle behaviour (a noisy draw vs a deterministic label), different target (a
distribution vs a point rule). Two literatures that, as far as the review found,
never cite each other for this comparison. Off-diagonal transfer should be near
zero in both directions; if it is not, the instrument is finding structure where
none was planted, and that is a calibration problem worth catching before the
real matrix is read.

**2. The cleanest L3 exemplar in the register**, and the only family so far whose
posterior genuinely cannot collapse. Truncating observations makes other families
L3 artificially -- here non-identifiability is intrinsic, because no finite number
of draws resolves a rate.

**3. It discharges Task Spec section 1.3.** The spec asks that at least one family
exercise a genuinely stochastic oracle, and warns that with deterministic f only,
all uncertainty in the system is epistemic, so a model that has never seen noisy
input given a known rule will be miscalibrated on input that is actually noisy.
`junk-random` is stochastic but carries no signal; this family is stochastic AND
learnable, which is the combination the warning is about.

**A contrast worth keeping in the register rather than discarding.** The
paradigm's own finding is that humans do NOT use `majority-predict` even though
it maximizes expected score -- they match the base rate instead. Our L3 target is
the exact posterior, so the correct behaviour under our loss is calibration, not
maximization. The family therefore encodes a place where the human result and the
normative target come apart, and it is a useful reference point when interpreting
whether a model is 'matching' because it is calibrated or because it is confused.
"""

