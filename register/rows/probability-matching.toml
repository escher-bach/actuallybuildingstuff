[form]
theta = "A hidden Bernoulli rate p, or a vector of rates over options. Discretized to a grid so the posterior is enumerable."
p_theta = "k sets the grid precision. Sample p uniformly from a STRICTLY INTERIOR grid -- endpoints excluded, since p=0 or p=1 is deterministic and resolvable, which would break the intrinsic non-identifiability the family exists for."
query_space = "predict the next outcome, or choose an option"
oracle = "Distribution-valued: returns the Bernoulli distribution at the queried option. The harness samples, exactly as with the junk-random plant -- and the fact that the same mechanism serves a junk family and a real one is evidence the interface is carrying stochasticity properly."
encodings = [
    "binary outcome tokens",
    "urn or draw narrative over anonymized option labels",
]
k_semantics = "Grid precision and option count. Finer grids make identification slower without making the task structurally harder, so precision is a knob on residual entropy specifically -- which makes this family a natural candidate for the Task Spec section 8 step 5 dial sweep."
teacher_query = "majority-predict is the score-maximizing point prediction; the L3 target is the posterior itself. With one option there is no query choice to make, so L2 is not claimed."
posterior = "Exact and cheap: Beta-Binomial conjugate update over the discretized grid, or direct enumeration. Among the easiest exact L3 targets available, which makes this the right family for unit-testing the L3 machinery against brute force."
trace = "Counts of each outcome so far. Minimal but honest."
stochastic = true
episode_length = "Never sufficient for identification, by design. That is the family's content."

