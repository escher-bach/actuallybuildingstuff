[form]
theta = "A permutation of the d coordinates."
p_theta = "k sets d; the permutation is drawn uniformly."
query_space = "bit-vectors of length d"
oracle = "Permute the coordinates of the query. O(d), no search."
encodings = [
    "bit list with a separator",
    "grouped rendering with a marker every four positions -- genuinely different length, not a separator swap",
]
k_semantics = "d. Difficulty is low at every d on its own; the knob matters only in composition, where it multiplies the composite hypothesis space."
teacher_query = "basis-probe: e_i reveals exactly where coordinate i is sent. O(1) per call, d calls total, no belief state."
posterior = "NOT implemented, and the method raises rather than returning something shaped wrongly: the codomain is a bit-vector, so an L3 target would be a distribution over vectors, which a per-token cross-entropy does not consume. This is a real limit of the interface for endomorphic families and is recorded rather than papered over."
trace = "Steps: the destination of each coordinate. Trivial."
stochastic = false
episode_length = "d queries under the basis schedule."

