notes = """
**Infrastructure, and the row says so rather than pretending otherwise.** On its
own this family is weak: identifying a permutation from (input, output) pairs is
easy, and it fails A4 badly. It exists because the register needed at least one
ENDOMORPHIC family -- one whose answers are the same shape as its queries -- and
had none.

**Why that mattered.** Task Spec section 1.1 makes composition the cheapest
route to A4 and the reason a finite basis can cover an infinite space, and a
large fraction of the register A4 verdicts name composition as their repair.
But T1 o T2 requires codomain(f2) to lie in X1, and every other implemented
family maps a structured query to a single label. A label cannot be fed back in
as a query. So the basis had essentially no composition closure, and those
repairs were citing an operation with no legal instance. See docs/07 hazard 21 --
it was silent because nothing checks that a named repair is performable, and it
only surfaced when composition was implemented rather than assumed.

**Composed under parity it reproduces the worked example of the Task Spec.**
`parity_of_permuted_bits` has theta = (subset, permutation) and a hypothesis
space that is the product -- a hidden relabelling wrapped around an operation,
which is the shape of the section 6 family in bit form. That composite is where
the A4 headroom argument can be checked rather than argued, and a test asserts
the product structure directly.

**One endomorphic family is barely closure.** The basis needs one per type it
intends to compose over. Recorded as a design requirement on future families
rather than something to rediscover.
"""

[[sources]]
