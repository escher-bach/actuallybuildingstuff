vein = "2.2"
their_term = "learning regular sets from queries; L*; grammatical inference"
substrate = "deterministic finite automata over a small anonymized alphabet"
status = "translated"
levels = ["L0", "L1", "L2"]
complexity_modes = ["serial_depth", "state_width"]
contents = ["state", "structure_induction"]
asymmetries = ["evaluate/search", "execute/infer"]
plant_role = "none"
plant_pair = ""
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "structure-walk-query",
]
predicted_block = "vein 2.2 separates DFA from the rest by oracle-access pattern: membership queries alone are provably insufficient, equivalence queries are required. If our measured blocks respect that separation it would be evidence the access-pattern taxonomy tracks something real; the prediction in docs/02 is that they will not."
notes = """
**SOURCE NOW VERIFIED, WITH SCOPE STATED. 2026-08-07.** Angluin 1988's citation
is confirmed from an authoritative record: Machine Learning 2:319-342, and the
abstract confirms it studies membership, equivalence, subset, superset,
disjointness and exhaustiveness queries, giving efficient learning methods for
regular languages, restricted context-free languages, pattern languages, and
**restricted types of propositional formulas**.

What that does and does not cover, stated precisely because the distinction
matters: it establishes **provenance** -- this family comes from that literature
-- and it does NOT verify the specific algorithm this row attributes to it
(anchor on a positive instance, flip one literal at a time). That algorithm is
folklore-level and mathematically self-evident; the register's citation for it is
provenance, not warrant.

This exposes something the register schema has been conflating -- see the
`provenance vs warrant` note in docs/07 hazard 20.

Angluin 1987 (L*) itself remains unchecked -- what was confirmed is the 1988
companion, which lists regular languages among the classes it treats. The row's
substantive claims about L*'s ORACLE MODEL (that it needs equivalence queries,
which we do not have) are the ones that matter here, and they are the reason the
row rejects importing L*'s bounds rather than the reason it accepts anything.

**This is the row where importing the source's machinery would have been a
mistake, and the rejection is more useful than the row.** L* requires an
EQUIVALENCE oracle -- 'is this hypothesis automaton correct, and if not give me a
counterexample'. Our L2 oracle answers only the query the model actually asked;
it is a pure membership oracle. Importing L*'s query-complexity bounds as our
cost model would overclaim, and membership queries alone are provably
insufficient for DFA identification in general.

What survives the translation is L*'s internal CONSTRUCTION, not its bounds. The
access-string plus distinguishing-suffix pair that L* needs an equivalence query
to discover, our teacher can simply compute -- it owns the automaton and
simulates it forward. This is the same move as the decision-tree row: the
learner's hard problem and the teacher's easy one are different problems, and A7
is a constraint on the teacher only.

**Cross-vein note: this row is the natural bridge to section 2.5's grammatical
inference material (Tomita, Abbadingo), which has published difficulty
parametrizations. Expect a near-duplicate or a merge when 2.5 is read; do not
pre-empt it.**
"""

