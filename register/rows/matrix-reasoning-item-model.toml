id = "matrix-reasoning-item-model"
title = "Matrix reasoning under a generated item model"
vein = "2.1"
their_term = "item model; item shell; cognitive design system; automatic item generation"
substrate = "figural matrix items -- a grid of cells related by transformation rules"
status = "translated"
levels = ["L0", "L1"]
complexity_modes = ["description_length", "state_width"]
contents = ["structure_induction", "composition"]
asymmetries = ["evaluate/search"]
plant_role = "none"
plant_pair = ""
primitives = [
    "abstraction-naming",
    "structure-walk-query",
    "constraint-propagation",
    "belief-state-maintenance",
    "hypothesis-elimination",
]
predicted_block = "cognitive design systems group matrix items by the processing operations attributed to them and by number of rules. Note this vein's taxonomy is the closest methodologically to ours -- a Q-matrix IS a measured capability decomposition -- so agreement with it would be the least informative match available and disagreement the most interesting."
notes = """
The closest prior art in the whole review, and the row where the vein's real
contribution turned out not to be a family.

**What actually transferred was a methodology, not a task.** Item generation
names our k/e distinction as radicals and incidentals, and unlike us it has an
empirical procedure for telling them apart -- fit an unconstrained
item-difficulty model against one constrained to depend on the radical alone,
and likelihood-ratio test the difference. Written up separately in
docs/04-radical-incidental.md, because it applies to every family in the
register rather than to this one.

The result that makes it worth adopting: in a study with N=208, the radical
explained 95.41% of difficulty variance and the LR test STILL rejected the
constrained model (chi-square(6)=24.21, p<.001), with within-family differences
of 6.82% and 12.36%. A radical explaining 95% of variance passes every eyeball
test there is, and its incidentals were leaking anyway. Every figure
curator-verified 2026-08-07.

**As a family it is weaker than as a source.** Matrix reasoning has a validated
radical set and a difficulty-regression apparatus, but no L1/L2/L3 machinery at
all -- the paradigm administers items, it does not withhold a rule and let a
subject probe. It fails A4 badly at published sizes for the usual reason. It is
registered because the item-model formalism genuinely round-trips through the
section 7 interface and because the composition content is real, not because it
is a strong candidate.

**Recorded L0 and L1 only.** L2 needs a q* over which cell to reveal next, which
is constructible but was not designed here; L3 needs an enumerable posterior over
rule combinations, which is plausible at small rule counts and unverified.
Claiming either would be filling in the form rather than reporting it.
"""

