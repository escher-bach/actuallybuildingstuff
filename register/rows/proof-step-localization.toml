id = "proof-step-localization"
title = "Corrupted proof-step localization on a formal backbone"
vein = "2.5"
their_term = "mutation analysis for proofs; first-wrong-step identification; proof error taxonomy"
substrate = "formal proof terms / tactic scripts (Coq, Lean, Isabelle) or a small closed toy calculus. NOT natural-language proof -- see A1."
status = "translated"
levels = ["L0", "L1", "L2", "L3"]
complexity_modes = ["serial_depth", "description_length"]
contents = ["state", "structure_induction", "selection"]
asymmetries = ["corrupt/localize"]
plant_role = "none"
plant_pair = ""
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "posterior-enumeration",
    "constraint-propagation",
    "structure-walk-query",
]
predicted_block = "the nearest published taxonomy is a 10-category grouping of how large reasoning models currently fail at proofs, over a 200-problem dataset. That is a grouping of naturally-occurring model errors, not of injectable corruptions, and it would predict difficulty groups by error TYPE. Score against it; do not adopt it. (Curator-checked 2026-08-06: the review said 11 categories; the paper reports 10.)"
notes = """
**The one substrate where no operator catalogue exists, and we would have to
author P_Theta ourselves.** Programs have four decades of validated mutation
operators; circuits have a small fault-mode vocabulary; plans get a catalogue
free from their validator. Proofs have nothing comparable. The closest artifacts
found: mCoq mutates the DEFINITIONS a proof is about rather than the proof's own
inference steps; one Lean robustness study uses an ad hoc three-way split
(number edits, symbol edits, proof-step edits); the process-supervision datasets
annotate naturally-occurring first-wrong-steps rather than injected ones. None is
a validated minimal-sufficient set.

The constructive route is to re-target mutation testing's three-way split at
inference rules: statement-level (delete or reorder a step), operand-level (swap
the cited premise or lemma), operator-level (swap the inference rule applied).
That is a design proposal by analogy, not an import, and it should be recorded as
ours rather than attributed.

**The sharpest cross-substrate contrast in the vein.** The A1 equivalence trap is
undecidable for programs and nearly absent here: kernel type-checking terminates
and is fast, and it is not the general equivalence problem. So the corruption's
invalidity is CHEAP to confirm at generation time -- provided the family sits on a
formal backbone. On natural-language proofs there is no O(1) oracle for 'is this
step actually wrong', and the family collapses into needing a judge, which is a
straight A1 violation. The repair is not to grade natural language better; it is
to generate on a formal backbone and render natural language as a display
encoding that is never the ground truth.

Also worth flagging so it is not miscategorized later: Alchemy-style 'symbolic
mutation' produces new VALID theorems to train a prover. Same word, opposite task
shape. It is not a corrupt/localize instance.
"""

