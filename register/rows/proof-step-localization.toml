[form]
theta = "A (step index, corruption operator) pair in an N-step proof. The operator catalogue must be authored by us -- see notes -- by re-targeting mutation testing's statement/operand/operator split at inference rules."
p_theta = "k sets proof depth N and catalogue breadth; sample (step, operator) pairs. Because the proof is generated first and corrupted after, generation never searches for a proof."
query_space = "'is step i valid given steps 1..i-1', or 'what is the correct continuation at step i'"
oracle = "Kernel type-check of the step against its cited premises. Exact, mechanical, terminating. This is the whole reason the family works."
encodings = [
    "formal proof-script text (tactic sequence)",
    "natural-language rendering of the same underlying formal derivation -- display only, never the ground truth",
]
k_semantics = "Proof depth N and catalogue breadth. Weakly evidenced -- taken by analogy to the program row's (site, operator) count, with no independent support found in the proof literature. Flagged rather than asserted."
teacher_query = "structure-walk-query: the teacher knows the corrupted step and synthesizes a check targeting it directly. One pass."
posterior = "Enumerable when the (step, operator) space is small -- same shape as the program row, linear in proof length times catalogue breadth."
trace = "Steps: the kernel's check of each inference against its premises. Natural, and thins cleanly by dropping premise-level detail first."
stochastic = false
episode_length = "Bounded by proof depth under a scan; shorter under a bisection strategy. Not established in the literature found."

[checks.theta_separable]
verdict = "pass"
reason = "The (step, operator) pair is the hidden parameter by construction, since we apply the corruption."

[checks.A1]
verdict = "repairable"
reason = "PASSES on a formal backbone and FAILS on natural-language proofs. Formally, corruption is an O(1) AST or tactic edit and confirming the corruption is genuinely invalid is a fast decidable kernel check -- crucially NOT the undecidable general-equivalence problem that bites the program row. On natural language there is no O(1) validity oracle and grading needs a judge, which is a solver on the generation path."
repair = "Always generate on a formal backbone -- Lean, Coq, Isabelle, or a small closed toy calculus such as natural deduction over anonymized propositional atoms -- and render natural language only as a display encoding whose validity is never checked."

[checks.A2]
verdict = "repairable"
reason = "Fails for proofs over concrete mathematical objects: whether a corrupted step is wrong can depend on real facts like x+1 > x, which are not permutable symbols."
repair = "Restrict Theta to proofs over abstract uninterpreted systems -- an anonymized propositional or first-order calculus, or an abstract algebraic theory with symbol-generic axioms. Note this repair aligns with the held-out partition rather than fighting it, since real analysis and Euclidean geometry are sealed anyway."

[checks.A3]
verdict = "pass"
reason = "Formal script and natural-language surface are genuinely different renderings over one verified backbone."

[checks.A4]
verdict = "repairable"
reason = "Fails at small proof depth. Re-running the kernel check at every candidate step is cheap, so exhaustive checking is barely worse than a smart localization strategy -- the same shape of failure as the program row, and for the same underlying reason: both the intended and the brute solver are cheap point-checks."
repair = "Require a large product of proof depth and catalogue breadth, or impose a query budget so the model cannot check every step for free. The query-budget repair is the more interesting one and is borrowed from the plan row, where it is the only repair available."

[checks.A5]
verdict = "pass"
reason = "constraint-propagation folds onto kernel checking against cited premises -- propagation over a proof DAG. Shares the rest with the other corrupt/localize rows."

[checks.A6]
verdict = "pass"
reason = "One kernel check per query; a malformed step reference returns a fixed error token."

[checks.A7]
verdict = "pass"
reason = "structure-walk-query, one pass given theta."
