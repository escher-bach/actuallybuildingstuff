id = "compaction-survival"
title = "Compaction survival -- carry an identified rule through a lossy summary"
vein = "2.7"
their_term = "context compaction; governance decay; constraint rot"
substrate = "any backward-generable base family, plus a summarizer we control"
status = "translated"
levels = ["L1", "L3"]
complexity_modes = ["input_entropy", "state_width"]
contents = ["state", "structure_induction"]
asymmetries = ["evaluate/search"]
plant_role = "none"
plant_pair = ""
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "posterior-enumeration",
    "epistemic-status-tagging",
]
predicted_block = "the harness literature groups this under context management, alongside memory and retrieval -- an engineering concern rather than a capability claim. It predicts nothing about our decomposition, and that is worth noting: the field has no theory here, only a measured failure."
notes = """
**The first row in the register with a MEASURED DEFICIT behind it rather than an
argument.** Every other family is motivated by a formalism, a paradigm, or a
schema. This one is motivated by a number.

Curator-verified from the primary source: across 7 models and 1,323 episodes,
context compaction raises constraint violation from **0% to 30%, up to 59%**.
The decomposition is what matters and is sharper than the headline: **when the
constraint survives the summary, violation is 0%; when it is dropped, 38%.**

That is not gradual degradation over a long context. It is a clean dissociation.
While the information is present the model obeys perfectly; once the summary
drops it, the model neither retains nor reconstructs it, roughly one time in
three. And decay is **8.3x larger for soft organizational policies than for hard
safety norms** -- i.e. it erodes exactly the deployment-specific standing
constraints that live in context rather than in weights.

**What this family manufactures.** Run an L1 episode until theta is identified.
Then replace the trial history with a lossy summary and continue querying. Theta
is unchanged; what changed is that the evidence for it is now second-hand. The
model must either have carried the identification or reconstruct it from what
survived.

**The knob is not summary quality, it is what the summary omits.** The source
result says failure lives specifically at the point where the load-bearing fact
is dropped, so a family that summarizes badly-but-uniformly would miss the
phenomenon. The generator controls the summary because it owns theta, which
means the omission can be targeted rather than random -- that is the whole
reason this is backward-generable.

**Two variants, and the source says they differ by 8.3x.** A fact DIRECTLY needed
for the next answer, versus a standing constraint that only SOMETIMES applies.
The second decays far faster and is the harder target; both should exist.

**Why this row is in a vein the source document does not have.** See
docs/01 -- vein 2.7 was added because Task Spec section 5 names agent use as a
target domain and every other vein is historical. The model this curriculum
trains gets deployed inside a harness, so the harness is the deployment input
distribution (docs/11), and compaction is a thing that will happen to it.
"""

[[sources]]
citation = "'Governance Decay: How Context Compaction Silently Erases Safety Constraints in Long-Horizon LLM Agents', arXiv:2606.22528. CURATOR-CHECKED 2026-08-07: 7 models, 1,323 episodes; violation 0% -> 30% (up to 59%) under compaction; survives-summary 0% vs dropped 38%; decay 8.3x larger for soft policies than hard safety norms; a ~47-token pinning defence restores 0%"
year = 2026
kind = "paper"
url = "https://arxiv.org/abs/2606.22528"
verified = true

[form]
theta = "The base family's hidden rule, unchanged. What the wrapper adds is a summarization event at a chosen trial index, and a specification of what the summary omits."
p_theta = "Sample the base family's theta and run trials until identification. k controls the omission rate -- how often the summary drops the load-bearing fact -- and which variant is in play (directly-needed fact vs standing constraint)."
query_space = "the base family's queries, continuing after the summarization event"
oracle = "The base family's oracle, unchanged. Theta does not move; only the visible evidence does."
encodings = [
    "trial history replaced inline by a prose summary",
    "trial history replaced by a structured digest with named fields",
    "history retained but marked stale, with the summary appended -- tests whether the model prefers fresh summary over stale detail",
]
k_semantics = "Omission rate, and the distance between the summarization event and the query that needs the omitted fact. Difficulty is expected non-monotone in that distance: adjacent is trivially recoverable, very distant may be unrecoverable and therefore uninformative. Sweep it."
teacher_query = "Inherited from the base family. Note the teacher is unaffected by compaction -- it owns theta throughout -- which is the usual teacher advantage and is unusually stark here: the model's whole difficulty is an information loss the teacher never suffers."
posterior = "Exact where the base family's is exact, and it is the interesting quantity: after a summary that DROPS the identifying evidence, the correct posterior widens back out. A model that stays confident is miscalibrated in exactly the way the source measured. This makes the family an L3 target as much as an L1 one."
trace = "Steps: what was known before the summary, what the summary preserved, what must be re-derived. The summary itself is the natural thinning boundary."
stochastic = false
episode_length = "Long enough to identify theta, plus a summarization event, plus enough trials after it for the loss to show. Longer than any other family in the register."

[checks.theta_separable]
verdict = "pass"
reason = "Theta is the base family's and is untouched by the wrapper. The summarization event is a property of the reveal policy, not of the rule."

[checks.A1]
verdict = "pass"
reason = "O(1) given the base family: run trials, write a summary that omits a chosen fact, continue. The generator owns theta so the omission is targeted rather than searched for -- which is precisely what makes this backward-generable, since finding a summary that loses the right thing would otherwise require a solver."

[checks.A2]
verdict = "repairable"
reason = "Inherits the base family's A2, but the SUMMARY is new surface and can leak. A summary written in natural language about symbol values would carry semantics the symbols themselves do not."
repair = "Generate the summary from a fixed template over anonymized symbols, and include it in the permuted-alphabet check rather than testing only the trial rendering. The check must cover the summary or A2 passes on a family whose only novel surface is unexamined."

[checks.A3]
verdict = "pass"
reason = "Three renderings, and the third is a genuine structural variant rather than a restatement -- retaining stale detail alongside the summary changes what the task is."

[checks.A4]
verdict = "repairable"
reason = "Inherits the base family's A4 and adds nothing by itself; a model that simply re-identifies theta from post-summary trials has bypassed the intended difficulty entirely."
repair = "Post-summary trials must be too few to re-identify theta from scratch. That is a hard constraint on episode construction, not a tuning preference -- get it wrong and the family measures the base family with extra steps."

[checks.A5]
verdict = "pass"
reason = "Contributes nothing new, which is the expected shape: this is a reveal-policy wrapper rather than a new computation. It does exercise epistemic-status-tagging in its natural setting -- a model that should say 'I no longer know' after a lossy summary."

[checks.A6]
verdict = "pass"
reason = "One evaluation per query, unchanged from the base family."

[checks.A7]
verdict = "pass"
reason = "Inherited. The teacher never loses information, so its policy is unaffected."
