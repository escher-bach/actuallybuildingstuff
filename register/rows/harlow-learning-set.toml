notes = """
**Rejected as a task family, and the rejection is the useful part.**

A single Harlow discrimination problem hides one bit: which of two stimuli is
rewarded. That is trivial by construction and it is trivial ON PURPOSE -- the
paradigm's object of study is not the problem, it is the *curve* of within-episode
learning rate measured across hundreds of freshly-sampled problems. Percent
correct on trial 2 rises from chance toward near-one-trial learning as problems
accumulate.

So this row fails A4 in a way that is not repairable and not a defect: there is
no hidden structure to make resistant, because the content was never in the
episode.

**What it actually is: the measurement protocol for our primary metric, with a
1949 apparatus behind it.** Task Spec section 4's within-episode acquisition
slope and section 9's claim that it is the primary controller signal -- 'if it
does not rise across a curriculum, nothing else in this section matters' -- is
Harlow's learning-set curve, measured on macaques, seventy-seven years earlier.
That is not a coincidence to note in passing; it means the programme's headline
metric has an externally-validated precedent, including evidence about what the
curve looks like when the thing works.

**Repair, which is conceptual rather than parametric:** treat Harlow as a
*curriculum wrapper* applicable to any admissible family -- repeat it across many
episodes with fresh theta and score the within-episode learning-rate curve across
the sequence. That belongs in the harness, not in the register, so this row is
terminal here.

Retained rather than deleted because Repertoire Spec section 4.1 says a rejected
family with a named reason is a result, and this particular reason -- 'the
content is in the protocol, not the episode' -- is a category we should expect to
meet again in behavioural veins.
"""

[[sources]]
citation = "H. F. Harlow, 'The Formation of Learning Sets', Psychological Review 56:51-65, 1949 -- 344 object-pair discrimination problems; trial-2 percent correct as a function of cumulative problem number"
year = 1949
kind = "paper"
url = ""
