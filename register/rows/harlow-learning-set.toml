[form]
theta = "Which of the presented stimuli is rewarded this problem. One bit."
p_theta = "Resampled every problem; that resampling IS the paradigm."
query_space = "choose one of the presented stimuli"
oracle = "Reward iff the chosen stimulus is theta's positive one."
encodings = [
    "arbitrary symbol pairs",
    "described object pairs in prose",
]
k_semantics = "Number of episodes in the curriculum, and stimulus-pool novelty. Neither is a within-episode difficulty knob, which is precisely why this is not a family."

