reason = "Theta is explicit and minimal."

[checks.A1]
verdict = "pass"
reason = "Trivially backward-generable."

[checks.A2]
verdict = "repairable"
reason = "Original stimuli are real objects; anonymize to symbol pairs."
repair = "Symbol pairs, as in the first encoding."

[checks.A3]
verdict = "pass"
reason = "Two renderings."

[checks.A4]
verdict = "fail"
reason = "A one-bit hidden parameter cannot resist anything. Not a flaw in the paradigm -- the paradigm's content is the across-episode learning curve, and the within-episode task is deliberately minimal so that curve is measurable without confound."
repair = "None as a family. As a protocol: wrap any other admissible family and score the within-episode acquisition slope across episodes. This is Task Spec section 4's primary metric, and Harlow is its precedent."

[checks.A5]
verdict = "pass"
reason = "Contributes nothing and conflicts with nothing."
