[checks.A2]
verdict = "pass"
reason = "A uniform distribution is permutation-invariant. permuted_alphabet_check passes, and a deliberately-broken subclass in the test suite confirms the check can actually fail -- a plant passing its own A2 check proves nothing unless failure is reachable."

[checks.A3]
verdict = "pass"
reason = "Two encodings sampled per episode. Minimal by intent; this is a plant, not a showcase."

[checks.A4]
verdict = "pass"
reason = "Vacuously: there is no structure to brute-force past. No shortest structure-ignoring solver exists because there is no structure."

[checks.A5]
verdict = "pass"
reason = "Shares no primitives with anything, which is the intended relation. Coherence is preserved by contributing nothing."

[checks.A6]
verdict = "pass"
reason = "One evaluation; malformed queries get the same uniform response, which is as sensible as anything can be here."

[checks.A7]
verdict = "pass"
reason = "Degenerately satisfied -- computable in one pass, and any policy is optimal since all queries are equally uninformative."
