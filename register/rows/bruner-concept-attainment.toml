predicted_block = "cognitive psychology treats this as concept attainment and groups it with categorization; computational learning theory treats its twin as exact learning of monotone conjunctions and groups it with query complexity. Neither field's taxonomy predicts the other's family is the same object."
notes = """
CODE EXISTS but the row stays at `lead`: implemented in
src/repertoire/families/concepts.py with tests asserting the two families
compute the same latent function under different surfaces. The blocker is
evidential, not technical -- Bruner chs. 4-6 is still unread, and status tracks what the
register can claim, not what has been built. Worth stating plainly because the
coverage tool reports this plant as missing, and that report is correct.

**The near-duplicate plant, paired with `conjunction-identification` from vein
2.2.** Repertoire Spec section 5 wants two families with different surfaces and
the same latent operation, ideally *two independent reinventions found in
different veins*. This is the best candidate available, and it is exactly the
shape the spec describes.

**The case.** The selection paradigm has the learner pick a card and be told only
positive or negative for that card -- a membership-query oracle, verbatim. The
conservative focusing strategy begins from a known positive instance and selects
instances differing in exactly one attribute, reading relevance off whether the
label flips. That is the standard membership-query algorithm for learning a
conjunction, published as a description of human strategy in 1956 and formalized
in learning theory three decades later.

**Evidence strength: MODERATE, and deliberately not upgraded.** The reviewing
agent could not read Bruner chapters 4-6 (only front matter reached) or Angluin
1988 in full, and searched for any publication connecting the two and found none.
That absence cuts both ways: it strengthens 'independently reinvented' and
weakens citability, because there is no third party to point at. **Before this
plant is treated as load-bearing, both primaries must be read in full to confirm
the algorithms are identical rather than merely similar.** Logged as a task.

**One known disanalogy to resolve on that read.** Bruner's array is 4 attributes
x 3 values; the learning-theory setup is usually a Boolean hypercube. They are
isomorphic only if 'differs in one feature' means 'differs in the value taken on
one attribute', which is how conservative focusing is described -- but the
generalization to v > 2 has not been checked against a primary source.

**What the plant tests.** If these two rows do not cluster tightly, the
instrument cannot see identity through a surface change, and the whole
translate-across-fields method loses its warrant. This is the single most
diagnostic pair in the register.
"""

