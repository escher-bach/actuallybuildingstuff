[form]
theta = "A conjunction of literals over d attributes with v values each -- which attributes are constrained, and to which value."
p_theta = "k sets d and v. Sample which attributes are relevant and their required values."
query_space = "the v^d cards"
oracle = "Membership test: does the card satisfy every literal in the conjunction. O(d)."
encodings = [
    "card array with attributes as abstract symbol IDs",
    "object-description prose over anonymized feature names",
    "tabular row with permuted attribute order",
]
k_semantics = "d and v. Headroom is available for free: conservative focusing needs O(d) queries while brute enumeration needs O(v^d)."
teacher_query = "Conservative focusing -- anchor on a known positive, vary one attribute at a time. Recorded as informative-query-selection AND basis-probe because the strategy catalogue spans both: focusing is a fixed schedule, focus gambling is the same primitive at higher risk tolerance (multi-attribute flips), and the paradigm's four strategies are a ready-made catalogue of q* variants."
posterior = "Enumerable while (v+1)^d is affordable. L3 available by truncating observations."
trace = "Steps: which attribute was varied and whether the label flipped. Clean, and thins by dropping the flip outcome."
stochastic = false
episode_length = "O(d) under conservative focusing. Bruner's own strategy catalogue is effectively a study of episode-length-vs-cognitive-load tradeoffs, which is a framing we have no equivalent of."

