reason = "Fails at the published 4x3 array: roughly 256 hypotheses over 81 cards is brute-forceable by an automated solver holding the whole table."
repair = "Scale d and v. The gap the constraint wants is available without invention here, since the intended solver is O(d) and enumeration is O(v^d) -- they just need to be far enough apart to bite."

