notes = """
**SOURCE NOW VERIFIED, WITH SCOPE STATED. 2026-08-07.** Angluin 1988's citation
is confirmed from an authoritative record: Machine Learning 2:319-342, and the
abstract confirms it studies membership, equivalence, subset, superset,
disjointness and exhaustiveness queries, giving efficient learning methods for
regular languages, restricted context-free languages, pattern languages, and
**restricted types of propositional formulas**.

What that does and does not cover, stated precisely because the distinction
matters: it establishes **provenance** -- this family comes from that literature
-- and it does NOT verify the specific algorithm this row attributes to it
(anchor on a positive instance, flip one literal at a time). That algorithm is
folklore-level and mathematically self-evident; the register's citation for it is
provenance, not warrant.

This exposes something the register schema has been conflating -- see the
`provenance vs warrant` note in docs/07 hazard 20.

IMPLEMENTED at src/repertoire/families/concepts.py, with tests asserting that
this family and its near-duplicate partner compute the same latent function
under different surfaces. Promoted from `lead` on 2026-08-07 when the citation
was confirmed; the row spent its first day at `lead` because the register's rule
is that a secondary description does not make a claim, and that rule was doing
real work rather than being ceremonial.

**Near-duplicate pairing now recorded, after vein 2.3 was read.** Paired with
`bruner-concept-attainment`. The hypothesis was written down here before that
vein was opened, precisely so that confirming it could not be a post-hoc
rationalization; the 2.3 review was asked to check it rather than to assume it,
and reported the two algorithms as structurally the same -- anchor on a known
positive, vary one attribute, read relevance off the label flip -- while
refusing to call the evidence better than MODERATE, since neither primary was
read in full and no existing publication connects them.

That last point is worth keeping: the absence of a connecting citation
strengthens the 'independently reinvented' framing and weakens citability at the
same time. See the partner row for the disanalogy still to resolve (Bruner's
array is 4 attributes x 3 values, not a Boolean hypercube).
"""

