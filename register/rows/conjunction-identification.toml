teacher_query = "basis-probe: establish a positive anchor, then flip one variable at a time to test each literal's relevance. O(1) per query, O(n) total, no belief state maintained."
posterior = "Enumerable while 3^n is affordable -- roughly n <= 12-15 unrestricted, considerably higher under a sparsity-biased prior. L3 available in that band."
trace = "Steps: which literal the assignment violated. Cheap. Thin to the bare truth value as n rises."
stochastic = false
episode_length = "O(n) queries to identification under the anchor-and-flip schedule."

