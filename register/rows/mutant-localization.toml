[form]
theta = "A (site, operator) pair: which AST location was mutated, using which catalogued operator. At order m, a set of m such pairs."
p_theta = "Draw uniformly (or corpus-frequency-weighted) over eligible sites x operator classes. The operator catalogue IS the sampler -- Offutt's sufficient five, or PIT's default eleven, are two independently-derived minimal sets and give two P_Theta to compare."
query_space = "test inputs to the program"
oracle = "Execute the mutant on the input, return its output. One execution, no search."
encodings = [
    "source text with the mutation embedded and unlabelled",
    "black-box call notation with the source withheld entirely -- the model interrogates only by calling",
    "execution-trace rendering with intermediate states exposed",
]
k_semantics = "Program size / candidate-site count is the sound knob. Mutation order is NOT -- see notes; the coupling effect undercuts it. Fault-to-observation distance is a strong factor but behaves as a validity gate (detectability collapsing to zero) rather than a smooth dial."
teacher_query = "structure-walk-query: the teacher knows the true (site, operator) and synthesizes a test input that exercises that site's data-flow path. One pass, no scan over surviving candidates. The learner's version -- selecting a kill-maximizing test -- is informative-query-selection and costs O(belief state); the gap between them is the teacher's advantage."
posterior = "Enumerable at 1st order: |Theta| ~ sites x operator classes, roughly linear in program size. Combinatorial at order m, which is a real growth knob for the posterior even though it is a poor difficulty knob for the solver."
trace = "Steps: the execution path through the mutated site, and the state at each point. Rich; thin by dropping intermediate states first, leaving only the output."
stochastic = false
episode_length = "Enough tests to discriminate the site. Not bounded in the literature in a form we can import -- mutation testing measures suite adequacy, not identification length."

[checks.theta_separable]
verdict = "pass"
reason = "The (site, operator) pair is exactly the hidden parameter, and mutation testing already treats it as one -- the mutant is generated FROM it."

[checks.A1]
verdict = "repairable"
reason = "Instance construction is O(1) -- apply the operator at the site. But filtering equivalent mutants is undecidable, and an unfiltered pool contains corruptions no query can detect."
repair = "Do not filter exactly. Probe with a bounded budget of sampled inputs and redraw theta if none distinguishes the mutant from the original. This is a cheap probabilistic proxy that keeps generation O(1); it leaves residual contamination which must be budgeted, at roughly the 26.5% scale the failed-error-propagation study measured for real faults."

[checks.A2]
verdict = "repairable"
reason = "Fails as published. ROR (relational operator replacement) depends on the real total-order semantics of < and <=, which are not permutable symbols, and identifier names leak intent constantly. This is the vein's most common silent failure."
repair = "Restrict to a small closed operator vocabulary treated as fixed non-permutable primitives -- the same treatment arithmetic operators get in the vein 2.2 algebraic families -- and anonymize every identifier. Passes only under that restriction, and the restriction must be part of the family definition rather than a preprocessing step someone might skip."

[checks.A3]
verdict = "pass"
reason = "Source-text, black-box call notation, and execution-trace renderings are structurally different, not merely differently punctuated. The black-box rendering is the interesting one: it changes what the model can even attend to."

[checks.A4]
verdict = "repairable"
reason = "Fails at 1st order on small programs. |Theta| grows only linearly in program size, so a solver that simulates every candidate against every test is not meaningfully worse than the intended structural solver -- brute force and intent coincide."
repair = "Grow program size and candidate-site count so O(C) enumeration per query becomes the real cost. Note the obvious alternative repair -- compose to higher mutation order -- is undercut by the coupling effect and should not be relied on without measuring it first."

[checks.A5]
verdict = "pass"
reason = "Shares belief-state-maintenance, hypothesis-elimination and posterior-enumeration with the other three corrupt/localize substrates and with the vein 2.2 identification families. Contributed no new primitive, which is the notable part."

[checks.A6]
verdict = "pass"
reason = "One test execution per query; wrong-arity or wrong-type input returns a fixed error token."

[checks.A7]
verdict = "pass"
reason = "structure-walk-query is one-pass given theta. The teacher knows where the fault is and can write a test that reaches it; the learner cannot, which is the asymmetry the family is built on."
