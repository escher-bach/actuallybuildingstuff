id = "mutant-localization"
title = "Mutant localization -- find the injected fault in a program"
vein = "2.5"
their_term = "mutation testing; mutation operators; fault seeding"
substrate = "imperative source code (Fortran/Mothra, Java/MuJava and PIT, C/Proteum). Substrate recorded because operator catalogues do not transfer between languages."
status = "translated"
levels = ["L0", "L1", "L2"]
complexity_modes = ["description_length", "state_width"]
contents = ["state", "selection"]
asymmetries = ["corrupt/localize"]
plant_role = "none"
plant_pair = ""
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "posterior-enumeration",
    "informative-query-selection",
    "structure-walk-query",
    "majority-predict",
]
predicted_block = "mutation testing's own theory would group families by test-suite adequacy and the coupling effect -- claims about test quality, not about which capability is exercised. It makes no prediction we can use, which is itself worth noting."
notes = """
First row on the corrupt/localize schema, and the vein's central A1 trap lives
here.

**The equivalence trap.** A mutant is *equivalent* if it is syntactically
different but semantically identical, so no test can kill it. Detecting
equivalence is undecidable, which means exact filtering cannot sit on the
generation path -- that would be a solver, and A1 forbids it. Repair is
probabilistic: probe with a bounded budget of sampled inputs and redraw theta if
nothing distinguishes the mutant. This leaves residual contamination that must be
budgeted rather than assumed away.

**How large that residual is -- corrected 2026-08-06, and the correction cuts
against the row.** The vein 2.5 review reported a Defects4J study finding 26.5%
of fault-test pairs exhibit failed error propagation, and that number was used
here to argue the hazard is one-in-four. **The figure is fabricated; it does not
appear in the paper** (see register/verification-log.md). The paper's actual
findings are close to the opposite: unit-level FEP with real faults occurred in
**0%** of 258,372 executions, and the authors describe unit-level prevalence as
negligible. System-level FEP was **11.4%** of executions across 4 bugs, and
mutants showed 1.6% internal / 3.7% external.

Consequence for this row: since our query space is *test inputs to a program* --
unit-level interrogation -- the invisible-corruption hazard is **much smaller
than argued**, and the probabilistic repair is correspondingly cheaper and more
reliable than first recorded. The hazard is real at system level, which is a
reason to keep the family's observation point close to the mutated site rather
than at the end of a long pipeline. Left visible rather than silently corrected,
because a row whose A-check rested on an invented statistic should show that it
did.

**Composing mutation order is NOT a free difficulty knob, and this is the
counter-intuitive part.** The obvious dial -- more simultaneous faults -- is
undercut by the coupling effect: test sets adequate for 1st-order mutants kill
over 99% of 2nd- and 3rd-order ones. Higher-order composition may buy almost no
difficulty against an informed solver. Contrast the circuit row, where multiple
faults genuinely do get harder through masking. Same-sounding knob, opposite
behaviour, different substrate. Do not assume one k means one thing.
"""

