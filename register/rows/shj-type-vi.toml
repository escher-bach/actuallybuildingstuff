[form]
theta = "Which subset of dimensions participates in the parity, and the output polarity. At the canonical d=3 all three participate, which is what makes no dimension droppable."
p_theta = "k sets d and the participating-subset size. Sample the subset and polarity uniformly."
query_space = "the 2^d stimuli"
oracle = "XOR the values on the participating dimensions, apply polarity. O(d)."
encodings = [
    "attribute-value tuples over abstract symbols",
    "object-description prose over anonymized feature names",
    "tabular row with permuted dimension order",
]
k_semantics = "d, and the size of the participating subset. Difficulty for a human is maximal when no dimension can be dropped; whether that is where an inducer finds it hardest is exactly what the plant asks."
teacher_query = "basis-probe: the fixed standard-basis schedule, identical to the parity family's. Does not depend on the history."
posterior = "Enumerable: subsets times polarity. L3 available by truncating observations."
trace = "Steps: running XOR accumulation across participating dimensions -- the same trace as the parity family, which is further evidence they are one object."
stochastic = false
episode_length = "d queries under the basis schedule."

