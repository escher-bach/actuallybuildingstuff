reason = "Same failure as `shj-type-i`: canonical size/colour/shape stimuli carry salience priors a pretrained model may share."
repair = "Anonymize dimensions to abstract symbol tokens."

[checks.A3]
verdict = "pass"
reason = "Three renderings including permuted dimension order."

[checks.A4]
verdict = "repairable"
reason = "Fails at the published 8-stimulus size for the usual reason -- the truth table is the whole function."
repair = "Scale d. Note the headroom argument is stronger here than for Type I: parity has no compressed representation shorter than the participating subset, so a structure-ignoring solver must hold 2^d while the intended solver holds d."

[checks.A5]
verdict = "pass"
reason = "Shares modular-add with the calibration row and basis-probe with parity and conjunction. The A5 check is doing real work here rather than rubber-stamping: it is what surfaced that this row and `parity-identification` are the same operation."

[checks.A6]
