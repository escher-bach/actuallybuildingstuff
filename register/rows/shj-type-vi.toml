id = "shj-type-vi"
title = "Shepard-Hovland-Jenkins Type VI -- full parity, no dimension droppable"
vein = "2.3"
their_term = "Type VI category structure; three-way parity / biconditional"
substrate = "Boolean concepts over d anonymized binary dimensions (canonically d=3, 8 stimuli)"
status = "implemented"
levels = ["L0", "L1", "L2", "L3"]
complexity_modes = ["description_length"]
contents = ["structure_induction", "manipulation"]
asymmetries = ["evaluate/search"]
plant_role = "dependent"
plant_pair = "shj-type-i"
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "basis-probe",
    "posterior-enumeration",
    "modular-add",
]
predicted_block = "the categorization literature keeps all six types in one paradigm block. We predict Type VI leaves it: parity over d dimensions IS mod-2 addition, which puts it with the vein 2.2 parity family rather than with its paradigm-mate `shj-type-i`."
notes = """
Implemented at src/repertoire/families/concepts.py; tests in
tests/test_concepts.py assert the plant property itself (Type VI really computes
parity, Type I really depends on exactly one dimension), not merely that the
code runs. Promoted past `lead` on the strength of the curator-checked
replication, even though the 1961 original remains unreachable.

The **B** of the planted prerequisite pair, and separately the most interesting
fold this vein produced.

**Type VI is parity.** The three-way biconditional over binary dimensions is
literally mod-2 addition over a subset of dimensions, which means it shares
`modular-add` with the calibration row and shares its whole solver shape with
`parity-identification` from vein 2.2. Two fields -- 1961 categorization
psychology and 1980s computational learning theory -- built the same object
without contact. That was not planted by us; it fell out of the primitive
vocabulary when both were written into the same form, which is precisely the kind
of unification Repertoire Spec section 1 says the novelty lives in.

**It also sets up a sharp test.** If the measured blocks put `shj-type-vi` with
`shj-type-i` (its paradigm-mate) rather than with `parity-identification` (its
structural twin), then paradigm membership predicts transfer better than
structure does, and our whole approach of translating across fields into one form
is buying less than it appears to. If it goes the other way, the translation is
doing real work. Either result is worth having and neither is available without
the pairing being recorded first.

Human difficulty ordering places this at the hard end (Type VI hardest of the
six, replicated). Hazard 1 applies in full: that is a human ordering and the
whole point of the plant is to test whether it transfers.
"""

