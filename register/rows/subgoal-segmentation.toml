id = "subgoal-segmentation"
title = "Subgoal segmentation -- recover the macro structure of a flat action sequence"
vein = "2.5"
their_term = "options; parametric macros; macro-plan decomposition"
substrate = "STRIPS-style action sequences over opaque action and macro names"
status = "translated"
levels = ["L0", "L1", "L3"]
complexity_modes = ["serial_depth", "state_width"]
contents = ["composition", "state"]
asymmetries = ["compose/decompose"]
plant_role = "none"
plant_pair = ""
primitives = [
    "abstraction-naming",
    "constraint-propagation",
    "belief-state-maintenance",
    "hypothesis-elimination",
    "posterior-enumeration",
]
predicted_block = "the planning literature groups by domain and by subgoal taxonomy; the options literature groups by whether a macro is a temporally extended action. Neither predicts anything about our capability decomposition."
notes = """
Third of the compose/decompose set, and the one that also carries `state` --
segmentation depends on preconditions holding, so the solver must track the world
forward rather than pattern-match the surface.

**Generation inherits the planning literature's backward trick, one level up.**
Standard practice generates a planning instance by applying a random action
sequence and then asking for the plan. Here we sample a random *macro* sequence
and concatenate the expansions, so the segmentation is known by construction and
the flat sequence is valid without any search. Same trick, applied to structure
rather than to states.

**A4 is a repairable fail, and the repair is the interesting part.** If macro
templates have visibly different fixed lengths, boundaries can be read straight
off the length pattern and the family collapses into surface segmentation --
which is not the capability we want. The repair is to require several macros to
share an output length, so boundaries are not locally decodable and the solver
must use preconditions. Worth noting because the naive version would still look
like it works.

**A7 is genuinely UNKNOWN, not assumed.** The reviewer did not design a teacher
policy for this family to completion, and it is not obvious that one is cheap:
choosing the query that best disambiguates a segmentation may require reasoning
over segmentations, which is the O(belief state) shape rather than the walk. So
L2 is NOT claimed here. Task Spec A7 warns that discovering which families cannot
support L2 late is expensive, and the honest position now is that we do not know
for this one -- which is itself the kind of result section 3 says to record.

**Do not conflate two difficulty parameters.** The planning literature has a real
easy-hard-easy non-monotonicity in the operators-to-state-variables ratio of
randomly sampled instances. That is a different parameter from macro-composition
depth here, and the sourced non-monotonicity says nothing about ours. Open
question, flagged rather than answered.
"""

[[sources]]
