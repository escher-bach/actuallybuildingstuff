id = "generic-finite-theta-versionspace"
title = "Generic finite-Theta version-space identification (halving / generalized binary search)"
vein = "2.2"
their_term = "Halving Algorithm; generalized binary search; version-space learning"
substrate = "arbitrary explicit finite hypothesis set over feature vectors; no algebraic structure assumed"
status = "translated"
levels = ["L0", "L1", "L2", "L3"]
complexity_modes = ["description_length", "input_entropy"]
contents = ["structure_induction", "selection"]
asymmetries = ["evaluate/search"]
plant_role = "suspected_junk"
plant_pair = ""
primitives = [
    "belief-state-maintenance",
    "hypothesis-elimination",
    "informative-query-selection",
    "posterior-enumeration",
    "majority-predict",
]
predicted_block = "vein 2.2 treats this as the fallback case rather than a class, so its taxonomy makes no prediction. That absence is itself informative: the field organizes by exploitable structure, and this row is the residue with none."
notes = """
This row is the direct answer to the review's central question -- when does q*
stay affordable -- and it is filed as SUSPECTED JUNK on purpose.

The greedy halving rule (query the point that splits the surviving hypothesis set
most evenly) is proved "approximately as good as any other strategy" for
minimizing label count, and costs O(|surviving Theta|) per query because it must
score every candidate -- the first claim is the source's, the second is ours.
That is cheap while |Theta| is polynomial in k and dies the moment |Theta| is
exponential. Every CHEAP verdict elsewhere in the vein is an escape from this
cost via structure the class happens to have; this row is what is left when there
is no structure to escape into.

Why suspected_junk rather than a production family: with no exploitable
structure, the shortest structure-ignoring solver IS the intended solver, so A4
fails at exactly the sizes where L3 is enumerable. Repertoire Spec section 5 says
to include candidates you cannot defend, because that is where you learn
something -- and the genuinely open question here is whether 'maintain a set and
cut it' is a transferable capability or merely a description of what any learner
does. The matrix answers that; argument will not.

Prediction, recorded before measurement: if this row shows real structural
content AND transfers to the structured families, then belief-state maintenance
is a capability in its own right. If it reads near-zero while the structured
families transfer to each other, then the capability lives in the structure and
not in the bookkeeping. Both outcomes are worth the row.
"""

