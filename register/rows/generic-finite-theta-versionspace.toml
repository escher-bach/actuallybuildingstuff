[form]
theta = "One member of an explicitly enumerated finite hypothesis set -- e.g. an arbitrary Boolean function over a small number of anonymized features."
p_theta = "k sets |Theta| directly, or the number of underlying features. Uniform over the enumerated set unless a prior is imposed."
query_space = "feature vectors"
oracle = "Table lookup. O(1)."
encodings = [
    "feature vector with anonymized feature names",
    "permuted feature order with a different separator token",
]
k_semantics = "|Theta| directly. This is the one row where k is the belief-state size rather than a property of the rule, which is why it is the right instrument for measuring where q* cost becomes prohibitive."
teacher_query = "informative-query-selection: score each candidate query by how evenly it splits the surviving set, take the argmax. Cost is O(|surviving Theta|) per call by inspection of the rule itself -- scoring requires touching every survivor. NOTE (curator-checked 2026-08-06): the review attributed this cost statement to Dasgupta explicitly; the paper's title, authorship and its 'approximately as good as any other strategy' result are confirmed, but the linear-in-version-space cost claim was NOT located in the source and is recorded here as our own reading, not a citation. Cheap while |Theta| <= ~1e4-1e5; prohibitive once |Theta| is exponential in the natural parameter."
posterior = "Enumerable by construction -- this family exists precisely to exercise posterior maintenance at controlled sizes. L3 targets are exact and cheap here, which also makes it the natural place to unit-test the L3 machinery against brute force."
trace = "Steps: which hypotheses were eliminated by the last observation. Honest but uninformative; thinning is not meaningful."
stochastic = false
episode_length = "Bounded by the teaching-dimension sandwich max{t0, log2|Theta|} <= #MQ <= t0 * log2|Theta|, which is a principled way to set T rather than guessing it -- and is one of the concrete things this vein supplies that the Task Spec left open."

[checks.theta_separable]
verdict = "pass"
reason = "Theta is enumerated explicitly; separability is definitional."

[checks.A1]
verdict = "pass"
reason = "Sample an index into the hypothesis set, sample a query, look up. O(1)."

[checks.A2]
verdict = "pass"
reason = "Feature identities anonymized; the family is defined over the index set, so relabelling is an exact symmetry."

[checks.A3]
verdict = "pass"
reason = "Two renderings. Thin, but this row is an instrument rather than a capability-bearing family."

[checks.A4]
verdict = "fail"
reason = "Fails outright at any size where the posterior is enumerable, which is the only size at which the row is usable. With no exploitable structure the structure-ignoring solver and the intended solver are the same program, so nothing grows faster than |f|. This is not an accident of parametrization -- it is what 'no structure' means."
repair = "None that preserves the row's purpose. Retain as a calibrated instrument for measuring q* cost and for unit-testing L3 against brute force, NOT as a production member of the basis. Any repair that gives it exploitable structure turns it into one of the other rows in this vein."

[checks.A5]
verdict = "pass"
reason = "It is where the generic primitives are defined most cleanly, so it anchors their meaning for every other row."

[checks.A6]
verdict = "pass"
reason = "One lookup; out-of-range feature vectors rejected with a fixed error token."

[checks.A7]
verdict = "pass"
reason = "Computable in one pass at the sizes where the row is used. The verdict is size-relative and the row exists to locate that boundary."
