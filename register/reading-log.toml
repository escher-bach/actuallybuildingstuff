Two findings larger than the row. Our L2 supervises the query channel against a
teacher policy; NOTHING in practice does -- clarification timing, tool recovery
and next-action choice are all graded by downstream outcome only. That is exactly
the design Task Spec section 2.1 rejects as "reinforcement learning with extra
steps", so our L2 is genuinely different rather than a reinvention. And the field
puts "decide what to work on next" in the HARNESS, which is L2's job done by the
scaffold -- making the harness layer an inventory of capability the model lacks.

Third finding, corroborating from an unexpected direction: partial guidance beat
fully structured workflows on pass rate. Same curve as the trace-thinning
literature in docs/05, from contemporary agent engineering rather than 1980s
instructional design.

